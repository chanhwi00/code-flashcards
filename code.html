<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>코딩 문제 카드장</title>
<style>
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:#f7f6f3; color:#2c2c2a; margin:0; padding:24px 16px 60px;
  }
  .wrap{max-width:680px; margin:0 auto;}
  h1{font-size:20px; font-weight:600; margin:0 0 4px;}
  .sub{font-size:13px; color:#6b6a64; margin:0 0 20px;}
  .tabs{display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid #e3e1db;}
  .tab{padding:8px 14px; font-size:14px; cursor:pointer; color:#6b6a64; border-bottom:2px solid transparent; user-select:none;}
  .tab.active{color:#2c2c2a; border-bottom-color:#378ADD; font-weight:600;}
  .panel{display:none;}
  .panel.active{display:block;}

  .stats{display:flex; gap:8px; margin-bottom:14px; font-size:13px; color:#6b6a64; flex-wrap:wrap;}
  .pill{background:#fff; border:1px solid #e3e1db; border-radius:20px; padding:4px 12px;}
  .filter-row{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .filter-btn{font-size:13px; padding:6px 12px; border-radius:20px; border:1px solid #c9c6bd; background:#fff; cursor:pointer;}
  .filter-btn.active{background:#2c2c2a; color:#fff; border-color:#2c2c2a;}

  .card{background:#fff; border:1px solid #e3e1db; border-radius:14px; padding:20px;}
  .q{font-size:16px; line-height:1.6; white-space:pre-wrap; margin:0 0 14px;}

  textarea{
    width:100%; font-family:"SF Mono", Consolas, monospace; font-size:13px; padding:10px;
    border:1px solid #c9c6bd; border-radius:8px; background:#fff; color:#2c2c2a; resize:vertical;
  }
  #code-input{min-height:120px;}

  .row{display:flex; gap:8px; margin-top:10px;}
  button{font-size:14px; padding:9px 14px; border-radius:8px; border:1px solid #c9c6bd; background:#fff; color:#2c2c2a; cursor:pointer;}
  button:hover{background:#f1efe8;}
  button:active{transform:scale(0.98);}
  button.primary{background:#2c2c2a; color:#fff; border-color:#2c2c2a;}
  button.grow{flex:1;}
  button.correct{background:#eaf3de; color:#27500a; border-color:#c0dd97;}
  button.correct.active{background:#639922; color:#fff;}
  button.wrong{background:#fcebeb; color:#791f1f; border-color:#f0a5a5;}
  button.wrong.active{background:#e24b4a; color:#fff;}

  .output-box{
    margin-top:10px; background:#1e1e1c; color:#e8e6e0; border-radius:8px; padding:12px 14px;
    font-family:"SF Mono", Consolas, monospace; font-size:13px; white-space:pre-wrap; min-height:20px; display:none;
  }
  .output-box.show{display:block;}
  .output-box.error{color:#f5a3a3;}

  .ref-box{
    margin-top:10px; background:#faf9f6; border:1px dashed #c9c6bd; border-radius:8px; padding:12px 14px;
    font-family:"SF Mono", Consolas, monospace; font-size:13px; white-space:pre-wrap; display:none;
  }
  .ref-box.show{display:block;}

  label{font-size:13px; color:#6b6a64; display:block; margin:14px 0 6px;}
  label:first-child{margin-top:0;}
  input[type=text]{width:100%; font-size:14px; padding:9px 10px; border:1px solid #c9c6bd; border-radius:8px;}
  select{width:100%; font-size:14px; padding:9px 10px; border:1px solid #c9c6bd; border-radius:8px; background:#fff;}

  .msg{font-size:13px; margin-top:10px; padding:8px 12px; border-radius:8px; display:none;}
  .msg.show{display:block;}

  .empty{text-align:center; color:#6b6a64; padding:40px 10px; font-size:14px;}

  .list-item{background:#fff; border:1px solid #e3e1db; border-radius:10px; padding:12px 14px; margin-bottom:8px;}
  .list-item .q{font-size:14px; margin-bottom:8px;}
  .list-top{display:flex; align-items:flex-start; gap:8px;}
  .list-top input[type=checkbox]{margin-top:3px;}
  .list-actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .list-actions button{font-size:12px; padding:5px 10px;}
  .del-btn{color:#791f1f; border-color:#f0a5a5;}
  .badge{font-size:11px; padding:3px 8px; border-radius:8px;}
  .list-ref{
    margin-top:8px; background:#faf9f6; border:1px dashed #c9c6bd; border-radius:8px; padding:10px 12px;
    font-family:"SF Mono", Consolas, monospace; font-size:12px; white-space:pre-wrap; display:none;
  }
  .list-ref.show{display:block;}
  .edit-form{margin-top:10px; display:none; border-top:1px solid #e3e1db; padding-top:10px;}
  .edit-form.show{display:block;}
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; flex-wrap:wrap;}
  .toolbar span{font-size:13px; color:#6b6a64;}
  .toolbar select{width:auto; flex:none;}

  .star-widget{display:inline-flex; gap:2px; vertical-align:middle;}
  .star{cursor:pointer; font-size:17px; color:#d9a441; user-select:none; line-height:1;}
  .star.empty{color:#d7d3c8;}
  .star-row{display:flex; align-items:center; gap:8px; margin-top:10px;}
  .star-row .label-inline{font-size:13px; color:#6b6a64;}

  .status-toggle-row{display:flex; gap:6px; margin-top:6px;}
  .status-toggle-row button{font-size:12px; padding:5px 10px;}

  .list-item.is-child{margin-left:22px; border-left:3px solid #d8d3c6; position:relative;}
  .list-item.is-child::before{content:"↳"; position:absolute; left:-20px; top:12px; color:#a8a49a; font-size:13px;}

  .star-filter-select{width:auto; font-size:13px; padding:6px 10px; border-radius:20px;}

  .sync-row{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .sync-row button{font-size:12px; padding:6px 12px;}
  .drive-status-text{font-size:12px; color:#6b6a64;}
</style>
</head>
<body>
<div class="wrap">
  <h1>코딩 문제 카드장</h1>
  <p class="sub" id="status-msg">파이썬 실행 환경 로딩 중...</p>

  <div class="sync-row" id="sync-row">
    <button id="drive-login-btn">🔗 구글 드라이브 연동하기</button>
    <span class="drive-status-text" id="drive-status"></span>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="review">복습하기</div>
    <div class="tab" data-tab="add">문제 추가</div>
    <div class="tab" data-tab="list">전체 목록</div>
  </div>

  <div class="panel active" id="panel-review">
    <div class="filter-row">
      <button class="filter-btn active" data-mode="all">전체</button>
      <button class="filter-btn" data-mode="wrong">틀린 것만</button>
      <button class="filter-btn" data-mode="selected" id="selected-filter-btn" style="display:none;">선택한 문제</button>
      <select id="star-filter-select" class="star-filter-select">
        <option value="">중요도 전체</option>
        <option value="eq3">★★★ 만</option>
        <option value="eq2">★★ 만</option>
        <option value="eq1">★ 만</option>
        <option value="ge1">★ 이상</option>
        <option value="ge2">★★ 이상</option>
      </select>
    </div>
    <div class="stats">
      <span class="pill" id="stat-total">전체 0개</span>
      <span class="pill" id="stat-pool">복습 대상 0개</span>
    </div>
    <div id="review-area"></div>
  </div>

  <div class="panel" id="panel-add">
    <label>문제</label>
    <textarea id="q-input" style="min-height:70px;" placeholder="문제 내용을 적어주세요"></textarea>
    <label>시작 코드 (함수 선언부, 선택)</label>
    <textarea id="starter-input" style="min-height:50px;">def solve(price):
    </textarea>
    <label>참고 정답 (선택)</label>
    <textarea id="ref-input" style="min-height:70px;" placeholder="내 모범 풀이나 힌트를 적어두세요"></textarea>
    <label>선행 문제 (선택 — 맞혀야 이 문제가 열려요)</label>
    <select id="parent-input">
      <option value="">없음 (독립 문제)</option>
    </select>
    <div class="row">
      <button class="primary grow" id="save-btn">카드 저장하기</button>
    </div>
    <div class="msg" id="save-msg"></div>
  </div>

  <div class="panel" id="panel-list">
    <div class="toolbar">
      <span></span>
      <div class="row" style="margin:0;">
        <button id="reset-status-btn">전체 상태 초기화</button>
        <button id="export-btn">백업 내보내기</button>
        <button id="import-btn">백업 불러오기</button>
        <input type="file" id="import-file-input" accept="application/json" style="display:none;">
      </div>
    </div>
    <div class="msg" id="backup-msg"></div>
    <div class="toolbar">
      <span id="select-count">0개 선택됨</span>
      <select id="list-sort-select">
        <option value="default">기본 순서</option>
        <option value="stars-desc">중요도 높은순</option>
        <option value="stars-asc">중요도 낮은순</option>
        <option value="status-desc">정답 먼저</option>
        <option value="status-asc">오답·미채점 먼저</option>
      </select>
      <button id="review-selected-btn">선택한 문제만 복습하기</button>
    </div>
    <div id="list-area"></div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<script>
const STORAGE_KEY = 'code_flashcards_data_v1';
let cards = [];
let pyodide = null;
let reviewMode = 'all';
let starFilter = '';
let listSortMode = 'default';
let selectedIds = [];
let currentCard = null;
let reviewQueue = [];   // 이번 라운드에서 뽑을 카드 id들을 순서대로 담아놓은 큐
let queueIndex = -1;    // reviewQueue에서 현재 위치
let sessionActive = false; // "시작!"을 눌러 큐가 준비된 상태인지
let sessionDone = false;   // 이번 라운드의 큐를 다 돌았는지

// ---- 구글 드라이브 연동 ----
const GOOGLE_CLIENT_ID = '59939161608-6od2m2693edbsinkr75iutegunh30tvk.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FILENAME = 'code_flashcards_data.json';
let tokenClient = null;
let driveAccessToken = null;
let driveFileId = null;
let driveSyncEnabled = false;
let driveSaveTimer = null;

function esc(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}
function newId(){
  return 'c' + Date.now() + Math.random().toString(36).slice(2);
}

function loadCards(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    cards = raw ? JSON.parse(raw) : [];
  }catch(e){
    cards = [];
  }
  let changed = false;
  cards.forEach(c => {
    if(!c.id){ c.id = newId(); changed = true; }
    if(c.status === undefined){ c.status = c.completed ? 'correct' : null; changed = true; }
    if(c.stars === undefined || c.stars === null){ c.stars = 0; changed = true; }
  });
  if(changed) saveCards();
}
function saveCards(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
  if(driveSyncEnabled && driveAccessToken && driveFileId){
    if(driveSaveTimer) clearTimeout(driveSaveTimer);
    // 짧은 시간 안에 여러 번 저장되는 걸 묶어서 API 호출 횟수를 줄임
    driveSaveTimer = setTimeout(() => {
      driveWriteFile(driveAccessToken, driveFileId, cards).then(() => {
        setDriveStatus('✅ 구글 드라이브에 저장됨', true);
      }).catch(err => {
        console.error('드라이브 저장 실패', err);
        if(err && err.message === 'AUTH_EXPIRED'){
          driveSyncEnabled = false;
          updateDriveButtonUI();
          setDriveStatus('⚠️ 로그인이 만료됐어요. "구글 드라이브 연동하기"를 다시 눌러주세요.', false);
        }else{
          setDriveStatus('⚠️ 드라이브 저장 실패 - 인터넷 연결을 확인해주세요.', false);
        }
      });
    }, 600);
  }
}

// ---- 구글 드라이브 API 헬퍼 함수들 ----

function setDriveStatus(text, ok){
  const el = document.getElementById('drive-status');
  if(!el) return;
  el.textContent = text;
  el.style.color = ok === true ? '#27500a' : (ok === false ? '#791f1f' : '#6b6a64');
}

function updateDriveButtonUI(){
  const btn = document.getElementById('drive-login-btn');
  if(!btn) return;
  btn.textContent = driveSyncEnabled ? '🔗 구글 드라이브 연동됨 (다시 로그인)' : '🔗 구글 드라이브 연동하기';
}

// 드라이브에서 우리 앱 전용 파일을 찾고, 없으면 새로 만듦
async function driveFindOrCreateFile(token){
  const q = encodeURIComponent(`name='${DRIVE_FILENAME}' and trashed=false`);
  const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {
    headers: { Authorization: 'Bearer ' + token }
  });
  if(searchRes.status === 401) throw new Error('AUTH_EXPIRED');
  const searchData = await searchRes.json();
  if(searchData.files && searchData.files.length > 0){
    return { id: searchData.files[0].id, isNew: false };
  }
  const boundary = 'flashcards_boundary_xyz';
  const metadata = { name: DRIVE_FILENAME, mimeType: 'application/json' };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n[]\r\n` +
    `--${boundary}--`;
  const createRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: {
      Authorization: 'Bearer ' + token,
      'Content-Type': `multipart/related; boundary=${boundary}`
    },
    body
  });
  if(createRes.status === 401) throw new Error('AUTH_EXPIRED');
  const createData = await createRes.json();
  return { id: createData.id, isNew: true };
}

async function driveReadFile(token, fileId){
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
    headers: { Authorization: 'Bearer ' + token }
  });
  if(res.status === 401) throw new Error('AUTH_EXPIRED');
  if(!res.ok) throw new Error('READ_FAILED');
  const text = await res.text();
  try{
    return JSON.parse(text);
  }catch(e){
    return [];
  }
}

async function driveWriteFile(token, fileId, dataArr){
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: 'PATCH',
    headers: {
      Authorization: 'Bearer ' + token,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(dataArr)
  });
  if(res.status === 401) throw new Error('AUTH_EXPIRED');
  if(!res.ok) throw new Error('WRITE_FAILED');
}

// "구글 드라이브 연동하기" 버튼 클릭
function connectDrive(){
  if(!tokenClient){
    setDriveStatus('구글 로그인 준비 중이에요. 잠시 후 다시 시도해주세요.', false);
    return;
  }
  tokenClient.requestAccessToken({ prompt: driveAccessToken ? '' : 'consent' });
}

// 구글 로그인 성공 후 콜백
function onDriveToken(resp){
  if(resp.error){
    setDriveStatus('로그인에 실패했어요: ' + resp.error, false);
    return;
  }
  driveAccessToken = resp.access_token;
  handleAfterDriveLogin();
}

async function handleAfterDriveLogin(){
  setDriveStatus('구글 드라이브와 동기화하는 중...', null);
  try{
    const { id, isNew } = await driveFindOrCreateFile(driveAccessToken);
    driveFileId = id;
    if(isNew){
      // 새로 만든 파일이라 지금 가지고 있는 로컬 카드를 그대로 올려보냄
      await driveWriteFile(driveAccessToken, driveFileId, cards);
    }else{
      // 이미 있던 파일이면 드라이브 내용으로 화면을 갱신 (다른 컴퓨터에서 만든 데이터일 수 있음)
      const remote = await driveReadFile(driveAccessToken, driveFileId);
      if(Array.isArray(remote)){
        cards = remote;
        cards.forEach(c => {
          if(!c.id) c.id = newId();
          if(c.status === undefined) c.status = null;
          if(c.stars === undefined || c.stars === null) c.stars = 0;
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
      }
    }
    driveSyncEnabled = true;
    updateDriveButtonUI();
    currentCard = null;
    sessionActive = false;
    sessionDone = false;
    renderList();
    renderReview();
    renderStats();
    setDriveStatus('✅ 구글 드라이브와 연동됐어요. 이제부터 자동으로 저장돼요.', true);
  }catch(e){
    console.error(e);
    if(e && e.message === 'AUTH_EXPIRED'){
      setDriveStatus('⚠️ 로그인이 만료됐어요. 버튼을 다시 눌러주세요.', false);
    }else{
      setDriveStatus('⚠️ 구글 드라이브 연동 중 오류가 발생했어요.', false);
    }
  }
}

function initGoogleAuth(){
  if(typeof google === 'undefined' || !google.accounts){
    setDriveStatus('구글 로그인 스크립트를 불러오지 못했어요. 새로고침 해보세요.', false);
    return;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: onDriveToken
  });
}


function isUnlocked(card){
  if(!card.parentId) return true;
  const parent = cards.find(c => c.id === card.parentId);
  if(!parent) return true;
  return parent.status === 'correct';
}

function matchesStarFilter(c){
  const s = c.stars || 0;
  switch(starFilter){
    case 'eq3': return s === 3;
    case 'eq2': return s === 2;
    case 'eq1': return s === 1;
    case 'ge1': return s >= 1;
    case 'ge2': return s >= 2;
    default: return true;
  }
}

function getPool(){
  return cards.filter(c => {
    if(reviewMode === 'wrong' && c.status !== 'wrong') return false;
    if(reviewMode === 'selected' && !selectedIds.includes(c.id)) return false;
    if(!matchesStarFilter(c)) return false;
    return true;
  });
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 이번 풀(pool) 안에서 무작위 순서를 만들되, 선행문제(parentId)가 있고
// 그 선행문제도 같은 풀에 있다면 선행문제보다 먼저 나오지 않도록 순서를 보장한다.
// (선행문제가 이번 풀에 없다면 — 다른 필터에 걸러졌다면 — 제약 없이 아무 때나 나올 수 있다)
function buildOrderedQueue(poolCards){
  const idSet = new Set(poolCards.map(c => c.id));
  const remaining = new Map(poolCards.map(c => [c.id, c]));
  const placed = new Set();
  const result = [];
  function isReady(c){
    if(!c.parentId) return true;
    if(c.parentId === c.id) return true;
    if(!idSet.has(c.parentId)) return true;
    return placed.has(c.parentId);
  }
  while(remaining.size > 0){
    const readyIds = [...remaining.keys()].filter(id => isReady(remaining.get(id)));
    if(readyIds.length === 0){
      // 이론상 순환 참조 등 예외 상황 — 남은 걸 그냥 다 넣어서 무한루프 방지
      [...remaining.keys()].forEach(id => { result.push(id); placed.add(id); });
      remaining.clear();
      break;
    }
    const pick = readyIds[Math.floor(Math.random() * readyIds.length)];
    result.push(pick);
    placed.add(pick);
    remaining.delete(pick);
  }
  return result;
}

// "시작!" - 현재 필터 조건에 맞는 문제 전부(잠긴 문제 포함)를 대상으로 새 라운드를 시작
function startSession(){
  const pool = getPool();
  if(pool.length === 0){
    sessionActive = false;
    sessionDone = false;
    currentCard = null;
    return;
  }
  reviewQueue = buildOrderedQueue(pool);
  queueIndex = 0;
  sessionActive = true;
  sessionDone = false;
  currentCard = cards.find(c => c.id === reviewQueue[0]) || null;
}

// 다음 문제로 이동. 큐를 다 쓰면 라운드 종료 — 자동으로 다시 섞지 않고 멈춘다.
function nextCard(){
  queueIndex++;
  if(queueIndex >= reviewQueue.length){
    sessionDone = true;
    currentCard = null;
    return;
  }
  const id = reviewQueue[queueIndex];
  const found = cards.find(c => c.id === id);
  if(!found){
    // 그 사이 삭제된 카드면 건너뜀
    nextCard();
    return;
  }
  currentCard = found;
}

// 이전 문제로 돌아가기. 큐의 맨 처음이면 더 갈 곳이 없음.
function prevCard(){
  if(queueIndex <= 0) return;
  queueIndex--;
  sessionDone = false;
  const id = reviewQueue[queueIndex];
  const found = cards.find(c => c.id === id);
  if(!found){
    // 그 사이 삭제된 카드면 한 칸 더 앞으로
    prevCard();
    return;
  }
  currentCard = found;
}

    `</span>`;

async function runCode(){
  const outBox = document.getElementById('output-box');

  if(!pyodide){
    outBox.textContent = '아직 파이썬 환경이 로딩 중이에요. 잠시만 기다려주세요...';
    return;
  }
  const code = document.getElementById('code-input').value;
  let captured = '';
  pyodide.setStdout({ batched: (s) => { captured += s + '\n'; } });
  try{
    await pyodide.runPythonAsync(code);
    outBox.textContent = captured.length ? captured : '(출력 없음)';
  }catch(e){
    outBox.classList.add('error');
    outBox.textContent = (captured ? captured : '') + '에러:\n' + e.message;
  }
}

function handleTabKey(e){
  if(e.key !== 'Tab') return;
  e.preventDefault();
  const el = e.target;
  const start = el.selectionStart;
  const end = el.selectionEnd;
  if(e.shiftKey){
    const lineStart = el.value.lastIndexOf('\n', start - 1) + 1;
    if(el.value.slice(lineStart, lineStart + 4) === '    '){
      el.value = el.value.slice(0, lineStart) + el.value.slice(lineStart + 4);
      el.selectionStart = start - 4;
      el.selectionEnd = end - 4;
    }
  }else{
    el.value = el.value.slice(0, start) + '    ' + el.value.slice(end);
    el.selectionStart = el.selectionEnd = start + 4;
  }
}

function statusRank(c){
  if(c.status === 'correct') return 2;
  if(c.status === 'wrong') return 1;
  return 0;
}

function sortSiblings(arr, mode){
  if(mode === 'default') return arr;
  const asc = mode.endsWith('asc');
  const copy = arr.slice();
  copy.sort((a, b) => {
    let va, vb;
    if(mode.startsWith('stars')){ va = a.stars || 0; vb = b.stars || 0; }
    else { va = statusRank(a); vb = statusRank(b); }
    return asc ? va - vb : vb - va;
  });
  return copy;
}

function getSortedFlatList(mode){
  const idSet = new Set(cards.map(c => c.id));
  const childrenMap = {};
  const roots = [];
  cards.forEach(c => {
    if(c.parentId && idSet.has(c.parentId) && c.parentId !== c.id){
      if(!childrenMap[c.parentId]) childrenMap[c.parentId] = [];
      childrenMap[c.parentId].push(c);
    }else{
      roots.push(c);
    }
  });
  const result = [];
  const visited = new Set();
  function addWithChildren(card, depth){
    if(visited.has(card.id)) return;
    visited.add(card.id);
    result.push({card, depth});
    const kids = childrenMap[card.id];
    if(kids && kids.length){
      sortSiblings(kids, mode).forEach(k => addWithChildren(k, depth + 1));
    }
  }
  sortSiblings(roots, mode).forEach(r => addWithChildren(r, 0));
  return result;
}

function exportBackup(){
  const dataStr = JSON.stringify(cards, null, 2);
  const blob = new Blob([dataStr], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const stamp = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
  a.href = url;
  a.download = `code_flashcards_backup_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showBackupMsg('백업 파일을 내려받았어요.', true);
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    let imported;
    try{
      imported = JSON.parse(e.target.result);
    }catch(err){
      showBackupMsg('파일을 읽을 수 없어요. 올바른 백업 파일인지 확인해주세요.', false);
      return;
    }
    if(!Array.isArray(imported)){
      showBackupMsg('올바른 백업 파일 형식이 아니에요.', false);
      return;
    }
    imported.forEach(c => {
      if(!c.id) c.id = newId();
      if(c.status === undefined) c.status = null;
      if(c.stars === undefined || c.stars === null) c.stars = 0;
    });
    const replace = confirm('가져온 데이터로 전체 목록을 교체할까요?\n\n확인 = 전체 교체\n취소 = 기존 목록에 합치기 (겹치는 항목은 건너뜀)');
    if(replace){
      cards = imported;
    }else{
      const existingIds = new Set(cards.map(c => c.id));
      const toAdd = imported.filter(c => !existingIds.has(c.id));
      cards = cards.concat(toAdd);
    }
    saveCards();
    currentCard = null;
    renderReview();
    renderList();
    renderStats();
    showBackupMsg(`불러오기 완료: 총 ${cards.length}개 문제`, true);
  };
  reader.onerror = () => showBackupMsg('파일을 읽는 중 오류가 발생했어요.', false);
  reader.readAsText(file);
}

  if(!q){
    msg.textContent = '문제 내용을 입력해주세요.';
    msg.style.background = '#fcebeb'; msg.style.color = '#791f1f';
    msg.classList.add('show');
    return;
  }
  cards.push({id:newId(), q, starter, ref, parentId, status:null, stars:0});
  saveCards();
  document.getElementById('q-input').value = '';
  document.getElementById('starter-input').value = 'def solve(price):\n    ';
  document.getElementById('ref-input').value = '';
  document.getElementById('parent-input').value = '';
  msg.textContent = '카드가 저장됐어요!';
  msg.style.background = '#eaf3de'; msg.style.color = '#27500a';
  msg.classList.add('show');
  setTimeout(()=> msg.classList.remove('show'), 2000);
  currentCard = null;
  renderReview();
  renderStats();
});

async function init(){
  loadCards();
  renderReview();
  renderStats();
  document.getElementById('drive-login-btn').addEventListener('click', connectDrive);
  initGoogleAuth();
  const statusMsg = document.getElementById('status-msg');
  try{
    pyodide = await loadPyodide();
    statusMsg.textContent = '내가 만든 코딩 문제를 랜덤으로 풀고, 직접 코드를 실행해서 확인해보세요.';
  }catch(e){
    statusMsg.textContent = '파이썬 실행 환경 로딩에 실패했어요. 인터넷 연결을 확인해주세요.';
  }
}
init();
</script>
