<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>코딩 문제 카드장</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <h1>코딩 문제 카드장</h1>
  <p class="sub" id="status-msg">파이썬 실행 환경 로딩 중...</p>

  <div class="sync-row" id="sync-row">
    <button id="drive-login-btn">🔗 구글 드라이브 연동하기</button>
    <span class="drive-status-text" id="drive-status"></span>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="review">복습하기</div>
    <div class="tab" data-tab="add">문제 추가</div>
    <div class="tab" data-tab="list">전체 목록</div>
  </div>

  <div class="panel active" id="panel-review">
    <div class="filter-row">
      <button class="filter-btn active" data-mode="all">전체</button>
      <button class="filter-btn" data-mode="wrong">틀린 것만</button>
      <button class="filter-btn" data-mode="selected" id="selected-filter-btn" style="display:none;">선택한 문제</button>
      <select id="star-filter-select" class="star-filter-select">
        <option value="">중요도 전체</option>
        <option value="eq3">★★★ 만</option>
        <option value="eq2">★★ 만</option>
        <option value="eq1">★ 만</option>
        <option value="ge1">★ 이상</option>
        <option value="ge2">★★ 이상</option>
      </select>
    </div>
    <div class="stats">
      <span class="pill" id="stat-total">전체 0개</span>
      <span class="pill" id="stat-pool">복습 대상 0개</span>
      <span class="pill" id="stat-progress" style="display:none; font-weight:600;">현재 1 / 1번</span>
    </div>
    <div id="review-area"></div>
  </div>

  <div class="panel" id="panel-add">
    <label>문제</label>
    <textarea id="q-input" style="min-height:70px;" placeholder="문제 내용을 적어주세요"></textarea>
    <label>시작 코드 (함수 선언부, 선택)</label>
    <textarea id="starter-input" placeholder="필요하면 시작 코드를 입력하세요"></textarea>
    <label>참고 정답 (선택)</label>
    <textarea id="ref-input" placeholder="내 모범 풀이나 힌트를 적어두세요"></textarea>
    <label>선행 문제 (선택 — 맞혀야 이 문제가 열려요)</label>
    <select id="parent-input">
      <option value="">없음 (독립 문제)</option>
    </select>
    <div class="row">
      <button class="primary grow" id="save-btn">카드 저장하기</button>
    </div>
    <div class="msg" id="save-msg"></div>
  </div>

  <div class="panel" id="panel-list">
    <div class="toolbar">
      <span></span>
      <div class="row" style="margin:0;">
        <button id="reset-status-btn">전체 상태 초기화</button>
        <button id="export-btn">백업 내보내기</button>
        <button id="import-btn">백업 불러오기</button>
        <input type="file" id="import-file-input" accept="application/json" style="display:none;">
      </div>
    </div>
    <div class="msg" id="backup-msg"></div>
    <div class="toolbar">
      <span id="select-count">0개 선택됨</span>
      <select id="list-sort-select">
        <option value="default">기본 순서</option>
        <option value="stars-desc">중요도 높은순</option>
        <option value="stars-asc">중요도 낮은순</option>
        <option value="status-desc">정답 먼저</option>
        <option value="status-asc">오답·미채점 먼저</option>
      </select>
      <button id="review-selected-btn">선택한 문제만 복습하기</button>
    </div>
    <div id="list-area"></div>
    <nav id="list-pagination" class="pagination" aria-label="전체 목록 페이지"></nav>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<script src="js/core.js"></script>
<script src="js/drive.js"></script>
<script src="js/review.js"></script>
<script src="js/cards.js"></script>
<script src="js/app.js"></script>
</body>
</html>
